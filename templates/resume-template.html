<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>{{NAME}} - Resume</title>
  <style>
    @page {
      size: letter;
      margin: 14mm 16mm;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #111111;
      background: #ffffff;
      line-height: 1.45;
      font-size: 10.3pt;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    /* ---------- Header ---------- */
    .header {
      text-align: center;
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: 22pt;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #111111;
      margin-bottom: 4px;
    }

    .contact-info {
      font-size: 9.3pt;
      color: #4b4b4f;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0;
    }

    .contact-item {
      display: inline-flex;
      align-items: center;
      color: #4b4b4f;
    }

    .contact-item a {
      color: #4b4b4f;
      text-decoration: none;
    }

    .contact-item a:hover {
      text-decoration: underline;
    }

    .contact-item:not(:last-child)::after {
      content: "|";
      margin: 0 8px;
      color: #d0d0d2;
    }

    /* ---------- Section ---------- */
    .section {
      margin-bottom: 13px;
      page-break-inside: avoid;
    }

    .section-title {
      font-size: 10.5pt;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #111111;
      border-bottom: 1px solid #111111;
      padding-bottom: 3px;
      margin-bottom: 8px;
    }

    /* ---------- Entry (education / experience / leadership) ---------- */
    .entry {
      margin-bottom: 9px;
      page-break-inside: avoid;
    }

    .entry:last-child {
      margin-bottom: 0;
    }

    .entry-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }

    .entry-title {
      font-weight: 700;
      font-size: 10.4pt;
      color: #111111;
    }

    .entry-date {
      font-size: 9.3pt;
      color: #6e6e73;
      white-space: nowrap;
      font-weight: 500;
    }

    .entry-subrow {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      font-style: italic;
      color: #4b4b4f;
      font-size: 9.6pt;
    }

    .entry-bullets {
      margin-top: 4px;
      padding-left: 15px;
    }

    .entry-bullets li {
      margin-bottom: 2px;
      color: #303033;
    }

    /* ---------- Projects ---------- */
    .project-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      font-size: 10.2pt;
    }

    .project-title {
      font-weight: 700;
      color: #111111;
    }

    .project-stack {
      font-weight: 400;
      font-style: italic;
      color: #4b4b4f;
    }

    .project-date {
      font-size: 9.3pt;
      color: #6e6e73;
      font-weight: 500;
      white-space: nowrap;
    }

    /* ---------- Coursework grid ---------- */
    .coursework-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px 12px;
      font-size: 9.8pt;
      color: #303033;
      list-style: none;
    }

    .coursework-grid li {
      position: relative;
      padding-left: 12px;
    }

    .coursework-grid li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: #9a9a9e;
    }

    /* ---------- Skills ---------- */
    .skills-grid {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .skill-row {
      display: flex;
      gap: 6px;
      font-size: 9.8pt;
    }

    .skill-cat {
      font-weight: 700;
      color: #111111;
      white-space: nowrap;
    }

    .skill-list {
      color: #303033;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- ================= HEADER ================= -->
    <header class="header">
      <h1>{{NAME}}</h1>
      <div class="contact-info">
        {{CONTACT_ITEMS}}
      </div>
    </header>

    <!-- ================= EDUCATION ================= -->
    {{EDUCATION_SECTION}}

    <!-- ================= RELEVANT COURSEWORK ================= -->
    {{COURSEWORK_SECTION}}

    <!-- ================= EXPERIENCE ================= -->
    {{EXPERIENCE_SECTION}}

    <!-- ================= PROJECTS ================= -->
    {{PROJECTS_SECTION}}

    <!-- ================= TECHNICAL SKILLS ================= -->
    {{SKILLS_SECTION}}

    <!-- ================= LEADERSHIP / EXTRACURRICULAR ================= -->
    {{LEADERSHIP_SECTION}}

  </div>
</body>

</html>
